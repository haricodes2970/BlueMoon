# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Defines apps/server as a Docker web service plus its PostgreSQL
# database. `fromDatabase: {property: connectionString}` resolves to
# Render's *internal* connection string automatically when both are
# in the same Render project/region — traffic between them never
# leaves Render's private network, satisfying the "internal
# DATABASE_URL" requirement without any manual wiring.
#
# apps/web is NOT defined here — it deploys separately on Vercel (see
# docs/deployment/README.md); Render Blueprints only manage
# Render-hosted services.
#
# Apply via Render's dashboard: "New" -> "Blueprint" -> select this
# repository. Adjust `plan`/`region` below before applying if the
# defaults (free tier, oregon) don't match the intended deployment —
# this file is a starting point, not a finished production config.
#
# The Dockerfile lives at the REPOSITORY ROOT (not apps/server/) --
# see docs/deployment/README.md's Troubleshooting section. This was
# a deliberate move made after `dockerContext: ./` combined with a
# dockerfilePath nested in apps/server/ repeatedly failed on Render
# with COPY "not found" errors for every path outside apps/server/,
# even after validating render.yaml against Render's own JSON Schema
# and confirming the repository itself was correct at every layer.
# Putting the Dockerfile at the root makes the build context correct
# by construction, independent of whether dockerContext is honored.
#
# `rootDir: .` is explicit, not relying on Render's documented "if
# omitted, defaults to repo root" behavior -- added after moving the
# Dockerfile still failed, this time with Render unable to find
# "Dockerfile" at all (not a COPY-target failure), which is the
# signature of the live service's effective build root not actually
# being the true repository root regardless of what this file's
# dockerContext says. See docs/deployment/README.md's Troubleshooting
# section for the full evidence trail.
#
# See docs/deployment/README.md and ADR-0033 for the full procedure
# and the reasoning behind adopting Render over Railway.

databases:
  - name: bluemoon-postgres
    plan: free
    region: oregon

services:
  - type: web
    name: bluemoon-server
    runtime: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bluemoon-postgres
          property: connectionString
      # 32+ random bytes, generated once by Render on first deploy --
      # never entered manually, never visible in this file. Rotating
      # it (e.g. after a suspected leak) requires updating it in the
      # Render dashboard directly, which also revokes every existing
      # access token signed with the old value.
      - key: JWT_ACCESS_TOKEN_SECRET
        generateValue: true
      # Not a secret -- the real deployed apps/web origin (Vercel's
      # default *.vercel.app domain; no custom domain configured).
      # Must exactly match what the browser sends as Origin, scheme
      # included.
      - key: WEB_ORIGIN
        value: https://blue-moon-web-zeta.vercel.app
      # apps/web (*.vercel.app) and this service (*.onrender.com) are
      # different registrable domains -- the "platforms' default
      # domains" fallback in
      # docs/deployment/README.md#two-supported-domain-shapes applies,
      # so the refresh cookie must be SameSite=None (requires
      # NODE_ENV=production, set above, since None also forces Secure).
      - key: COOKIE_SAME_SITE
        value: None
      - key: LOG_LEVEL
        value: info
    # PORT is Render-injected automatically -- do not set it here;
    # apps/server already reads process.env.PORT via loadServerEnv().
